<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<meta name="description" content="{{ config.description }}">
<style>
/* Catppuccin Latte (light) and Mocha (dark), mauve accent */
:root{--bg:#eff1f5;--fg:#4c4f69;--mut:#6c6f85;--ac:#8839ef;--bd:#ccd0da;--code:#e6e9ef}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e2e;--fg:#cdd6f4;--mut:#a6adc8;--ac:#cba6f7;--bd:#313244;--code:#181825}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac)}
header{border-bottom:1px solid var(--bd);padding:.8rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
header .brand{font-weight:700;color:var(--fg);text-decoration:none;font-size:1.15rem}
header nav a{margin-right:.9rem;text-decoration:none;color:var(--mut)}
header nav a:hover{color:var(--ac)}
main{max-width:50rem;margin:0 auto;padding:1.5rem 1rem 4rem}
img{max-width:100%;height:auto;border-radius:8px}
pre{background:var(--code);padding:1rem;border-radius:8px;overflow-x:auto;font-size:.88rem}
code{background:var(--code);padding:.1em .3em;border-radius:4px;font-size:.9em}
pre code{background:none;padding:0}
table{border-collapse:collapse;display:block;overflow-x:auto}
td,th{border:1px solid var(--bd);padding:.35rem .6rem}
.hero{padding:2rem 0 1rem}.hero h1{font-size:2.4rem;margin:0}.hero p{color:var(--mut);font-size:1.15rem}
main.wide{max-width:68rem}
.hero.home{padding:2.5rem 0 1rem}.hero.home h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.15}
.hero.home .lede{font-size:1.2rem;max-width:42rem}
.cta{display:flex;flex-wrap:wrap;gap:.7rem;margin:1.2rem 0}
.btn{display:inline-block;padding:.6rem 1.1rem;border-radius:8px;border:1px solid var(--bd);text-decoration:none;font-weight:600;color:var(--fg)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--bg)}
figure{margin:1.5rem 0}figcaption{color:var(--mut);font-size:.9rem;margin-top:.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;margin:1rem 0}
.grid>div{border:1px solid var(--bd);border-radius:10px;padding:1rem}
.grid h3{margin:0 0 .4rem;font-size:1.05rem}.grid p{margin:0;color:var(--mut);font-size:.95rem}
</style>
</head>
<body>
<header>
<a class="brand" href="{{ get_url(path='/') }}">K9k</a>
<nav>
{% set root = get_section(path="_index.md") %}
{% for p in root.pages %}<a href="{{ p.permalink }}">{{ p.title }}</a>{% endfor %}
<a href="{{ config.extra.repo }}">GitHub</a>
</nav>
</header>
<main{% block mainclass %}{% endblock %}>{% block content %}{% endblock %}</main>
</body>
</html>
