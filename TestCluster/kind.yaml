# Local integration cluster for exercising K9k against real Kubernetes APIs.
# Create it with: kind create cluster --config TestCluster/kind.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k9k-test
nodes:
  - role: control-plane
  - role: worker
  - role: worker
networking:
  disableDefaultCNI: false
  kubeProxyMode: iptables
