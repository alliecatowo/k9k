# Apply after the Kind cluster is ready:
#   kubectl apply -f TestCluster/fixtures.yaml
# All objects intentionally live in the k9k-fixtures namespace and use
# non-sensitive placeholder data, so they are safe to create and delete locally.
apiVersion: v1
kind: Namespace
metadata:
  name: k9k-fixtures
  labels:
    app.kubernetes.io/part-of: k9k-fixtures
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: application-settings
  namespace: k9k-fixtures
  labels:
    app.kubernetes.io/name: web
data:
  LOG_LEVEL: debug
  FEATURE_FLAG: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: placeholder-credentials
  namespace: k9k-fixtures
  labels:
    app.kubernetes.io/name: web
type: Opaque
stringData:
  username: example-user
  password: not-a-real-password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fixture-reader
  namespace: k9k-fixtures
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader
  namespace: k9k-fixtures
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fixture-reader-can-read-config
  namespace: k9k-fixtures
subjects:
  - kind: ServiceAccount
    name: fixture-reader
    namespace: k9k-fixtures
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k9k-fixtures
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      serviceAccountName: fixture-reader
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: application-settings
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k9k-fixtures
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: k9k-fixtures
spec:
  rules:
    - host: web.k9k.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: k9k-fixtures
  labels:
    app.kubernetes.io/name: database
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database
    spec:
      containers:
        - name: database
          image: registry.k8s.io/pause:3.10
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: k9k-fixtures
  labels:
    app.kubernetes.io/name: node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
    spec:
      containers:
        - name: node-agent
          image: registry.k8s.io/pause:3.10
---
apiVersion: batch/v1
kind: Job
metadata:
  name: completed-job
  namespace: k9k-fixtures
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: complete
          image: registry.k8s.io/busybox:1.36
          command: ["sh", "-c", "echo fixture job completed"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: heartbeat
  namespace: k9k-fixtures
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: heartbeat
              image: registry.k8s.io/busybox:1.36
              command: ["sh", "-c", "date"]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.k9k.example.com
spec:
  group: k9k.example.com
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    shortNames: [widget, wdg]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                priority:
                  type: integer
            status:
              type: object
              properties:
                state:
                  type: string
      subresources:
        status: {}
---
apiVersion: k9k.example.com/v1alpha1
kind: Widget
metadata:
  name: sample-widget
  namespace: k9k-fixtures
  labels:
    app.kubernetes.io/part-of: k9k-fixtures
spec:
  message: K9k discovers custom resources
  priority: 10
status:
  state: Ready
